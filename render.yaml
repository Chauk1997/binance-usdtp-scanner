services:
  - type: web
    name: scanner-v54-free
    runtime: python
    plan: free
    region: singapore
    branch: migration/free-benchmark
    buildCommand: pip install --no-cache-dir -r requirements-render.txt
    startCommand: uvicorn render_service:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: SCANNER_SCHEDULER_ENABLED
        value: '0'
      - key: SCANNER_ALLOWED_REF
        value: refs/heads/migration/free-benchmark
